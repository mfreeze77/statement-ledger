repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: foundation-types
        name: Foundation strict types
        entry: uv run --locked mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: module-boundaries
        name: Module ownership boundaries
        entry: uv run --locked python scripts/check-boundaries.py
        language: system
        pass_filenames: false
        types: [python]
