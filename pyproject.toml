[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "statement-ledger"
version = "0.2.0"
description = "Source-bound public statement research ledger with reviewed identity and evidence provenance"
requires-python = ">=3.11"
dependencies = ["fastapi==0.128.2", "pydantic==2.13.4", "httpx==0.28.1", "uvicorn==0.48.0"]

[project.optional-dependencies]
test = ["pytest==9.0.2", "pytest-cov>=6,<8"]

[project.scripts]
statement-ledger = "statement_ledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
statement_ledger = ["static/*", "sources.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["live: needs secrets, real providers, GPU or licensed media; runs only with SL_RUN_LIVE=1"]
