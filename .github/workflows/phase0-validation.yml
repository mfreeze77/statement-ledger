name: phase0-validation
on:
  push:
    branches: ['phase0/foundation']
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export exact baseline
        run: |
          mkdir -p /tmp/phase0-baseline
          git archive --format=zip -o /tmp/phase0-baseline/source.zip HEAD
          git bundle create /tmp/phase0-baseline/source.bundle --all
          git rev-parse HEAD > /tmp/phase0-baseline/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phase0-baseline
          path: /tmp/phase0-baseline
          retention-days: 3
