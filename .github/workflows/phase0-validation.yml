name: phase0-validation
on:
  push:
    branches: ['phase0/foundation']
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Export exact baseline and validation tools
        run: |
          mkdir -p /tmp/phase0-baseline/wheels
          git archive --format=zip -o /tmp/phase0-baseline/source.zip HEAD
          git bundle create /tmp/phase0-baseline/source.bundle --all
          git rev-parse HEAD > /tmp/phase0-baseline/commit.txt
          python -m pip download --only-binary=:all: --dest /tmp/phase0-baseline/wheels ruff==0.14.14 mypy==1.19.1 pre-commit==4.5.1 uv==0.10.0 pydantic-settings==2.14.1
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/phase0-baseline/gitleaks.tar.gz
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o /tmp/phase0-baseline/gitleaks_checksums.txt
          cd /tmp/phase0-baseline
          grep 'gitleaks_8.30.1_linux_x64.tar.gz' gitleaks_checksums.txt | sed 's/gitleaks_8.30.1_linux_x64.tar.gz/gitleaks.tar.gz/' | sha256sum --check
      - uses: actions/upload-artifact@v4
        with:
          name: phase0-baseline
          path: /tmp/phase0-baseline
          retention-days: 3
