name: phase0-apply
on:
  push:
    branches: [assistant/phase0-foundation]
    paths: [.github/workflows/phase0-apply.yml]
permissions:
  contents: write
  actions: read
jobs:
  apply:
    if: github.repository == 'mfreeze77/statement-ledger' && github.ref == 'refs/heads/assistant/phase0-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact transformation tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install uv==0.9.21 ruff==0.14.10
      - uses: actions/download-artifact@v4
        with:
          name: phase0-resolved
          run-id: 36369732696
          github-token: ${{ github.token }}
          path: /tmp/phase0-resolved
      - name: Verify and apply tested implementation
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, shutil, subprocess
          from pathlib import Path
          root = Path.cwd()
          base = 'ffcb18bca3b229772418c6fdb64087a3f161a54f'
          changed = subprocess.check_output(['git','diff','--name-only',base,'HEAD'], text=True).splitlines()
          allowed = {'.github/workflows/phase0-toolchain.yml', '.github/workflows/phase0-apply.yml'}
          assert all(p in allowed or p.startswith('.phase0-transfer/') for p in changed), 'Unexpected intervening source edits'
          encoded = ''.join((root/'.phase0-transfer'/f'{i:02d}.b64').read_text() for i in range(1,9))
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == 'd866891a2c0db2957c11a480524167754df45c0d1a14933f5bafc21299e2cddc'
          payload = json.loads(lzma.decompress(compressed))
          assert payload['base_sha'] == base
          script = Path('/tmp/phase0-restructure.py')
          script.write_text(payload['restructure'], encoding='utf-8')
          subprocess.run(['python',str(script),str(root)], check=True)
          subprocess.run(['ruff','check','--fix','--select','E4,E7,E9,F,I,UP','--target-version','py311','.'], check=False)
          subprocess.run(['ruff','format','--line-length','100','.'], check=True)
          subprocess.run(['git','apply','--whitespace=nowarn','-'], input=payload['patch'], text=True, check=True)
          for name, content in payload['files'].items():
              path = (root/name).resolve()
              assert path.is_relative_to(root) and '.git' not in Path(name).parts
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8')
          for name in payload['deleted']:
              path = (root/name).resolve()
              assert path.is_relative_to(root) and '.git' not in Path(name).parts
              path.unlink(missing_ok=True)
          shutil.copyfile('/tmp/phase0-resolved/uv.lock', 'uv.lock')
          shutil.copyfile('/tmp/phase0-resolved/gpu-uv.lock','environments/gpu/uv.lock')
          shutil.rmtree('.phase0-transfer')
          Path('.github/workflows/phase0-toolchain.yml').unlink(missing_ok=True)
          Path('.github/workflows/phase0-apply.yml').unlink()
          PY
      - name: Regenerate and check final source tree
        run: |
          set -euo pipefail
          uv sync --locked --group dev
          uv run --locked python scripts/export-contracts.py
          uv run --locked python scripts/compile-spec.py
          git add -A
          uv run --locked python scripts/check.py check | tee /tmp/phase0-validation.txt
          uv build
          git diff --cached --exit-code -- LICENSE
      - name: Publish implementation without rewriting history
        run: |
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Implement Phase 0 foundation: modular core, locked environments, migrations and fenced workers'
          git push origin HEAD:assistant/phase0-foundation
          git bundle create /tmp/statement-ledger-phase0.bundle --all
          git rev-parse HEAD > /tmp/phase0-final-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase0-implementation-proof
          path: |
            /tmp/phase0-validation.txt
            /tmp/statement-ledger-phase0.bundle
            /tmp/phase0-final-sha.txt
          retention-days: 3
