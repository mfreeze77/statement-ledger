name: phase0-toolchain
on:
  push:
    branches: [assistant/phase0-foundation]
    paths: [.github/workflows/phase0-toolchain.yml]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Resolve exact lockfiles and image references
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase0-resolved /tmp/project/src/statement_ledger /tmp/project/environments/gpu
          python -m pip install uv==0.9.21
          cat > /tmp/project/pyproject.toml <<'EOF'
          [build-system]
          requires = ["setuptools==80.9.0"]
          build-backend = "setuptools.build_meta"
          [project]
          name = "statement-ledger"
          version = "0.3.0"
          description = "Source-bound public statement research ledger with reviewed identity and evidence provenance"
          requires-python = ">=3.11,<3.14"
          dependencies = ["fastapi==0.128.2", "pydantic==2.13.4", "httpx==0.28.1", "uvicorn==0.48.0"]
          [project.optional-dependencies]
          test = ["pytest==9.0.2", "pytest-cov==7.0.0"]
          [dependency-groups]
          dev = ["pytest==9.0.2", "pytest-cov==7.0.0", "ruff==0.14.10", "mypy==1.19.1", "pre-commit==4.5.1"]
          [project.scripts]
          statement-ledger = "statement_ledger.application.cli:main"
          [tool.setuptools.packages.find]
          where = ["src"]
          EOF
          touch /tmp/project/src/statement_ledger/__init__.py
          cat > /tmp/project/environments/gpu/pyproject.toml <<'EOF'
          [project]
          name = "statement-ledger-gpu-runtime"
          version = "0.3.0"
          requires-python = ">=3.11,<3.12"
          dependencies = ["statement-ledger", "torch==2.8.0", "torchaudio==2.8.0", "faster-whisper==1.2.1", "pyannote.audio==4.0.3", "speechbrain==1.0.3"]
          [tool.uv]
          package = false
          [tool.uv.sources]
          statement-ledger = {path = "../..", editable = true}
          torch = {index = "pytorch-cu128"}
          torchaudio = {index = "pytorch-cu128"}
          [[tool.uv.index]]
          name = "pytorch-cu128"
          url = "https://download.pytorch.org/whl/cu128"
          explicit = true
          EOF
          uv lock --project /tmp/project
          uv lock --project /tmp/project/environments/gpu
          cp /tmp/project/uv.lock /tmp/phase0-resolved/uv.lock
          cp /tmp/project/environments/gpu/uv.lock /tmp/phase0-resolved/gpu-uv.lock
          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          images = {}
          for name, image in {'UV_IMAGE':'ghcr.io/astral-sh/uv:0.9.21', 'PYTHON_IMAGE':'python:3.13-slim-bookworm', 'GPU_PYTHON_IMAGE':'python:3.11-slim-bookworm', 'GITLEAKS_IMAGE':'zricethezav/gitleaks:v8.24.2'}.items():
              result = subprocess.check_output(['docker','buildx','imagetools','inspect',image], text=True)
              digest = re.search(r'^Digest:\s+(sha256:[0-9a-f]{64})', result, re.M).group(1)
              images[name] = image + '@' + digest
          Path('/tmp/phase0-resolved/images.json').write_text(json.dumps(images, indent=2)+'\n')
          PY
          git bundle create /tmp/phase0-resolved/baseline.bundle --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase0-resolved
          path: /tmp/phase0-resolved
          retention-days: 1
