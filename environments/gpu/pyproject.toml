[project]
name = "statement-ledger-gpu-runtime"
version = "0.3.0"
requires-python = ">=3.11,<3.12"
dependencies = ["statement-ledger", "torch==2.8.0", "torchaudio==2.8.0", "faster-whisper==1.2.1", "pyannote.audio==4.0.3", "speechbrain==1.0.3"]

[tool.uv]
package = false

[tool.uv.sources]
statement-ledger = {path = "../..", editable = true}
torch = {index = "pytorch-cu128"}
torchaudio = {index = "pytorch-cu128"}

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
